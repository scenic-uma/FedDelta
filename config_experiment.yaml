# ===========================================
# GLOBAL EXPERIMENT CONFIGURATION
# ===========================================

# List of datasets to evaluate
datasets_list: 
# ==================================================================
# TABULAR-BASED DATASETS
# ==================================================================
  #anxiety:
  #  variable_target: Therapy Sessions (per month)
  
  #insurance:
  #   variable_target: charges
  
  housing:
    variable_target: median_house_value
  
  #discharges:
  #  variable_target: Total Charges
  
  #length_of_stay:
  #  variable_target: 
  #  - lengthofstay
  #  - glucose 
  
  #european_survey_adult:
  #  variable_target: 
  #    - G21
  #    - P85_2
  #    - L45
  #    - SEVERIDAD_DEPRESIVA
  #    - G23

    # P85_2: Consumption of prescription drugs during the last two weeks
    # L45: Degree of pain experienced during the last 4 weeks
    # SEVERIDAD_DEPRESIVA: Derived variable: Severity of depressive symptomatology
    # G23: Degree of limitation for at least 6 months due to a health problem
    # G21: Perceived health status over the last 12 months

# ===========================================
# DATA SAMPLING & NODES
# ===========================================

# Minimum/maximum number of samples per node
node_samples_list:
  #- node_min_samples: 10
  #  node_max_samples: 50
  #  min_samples_train: 10
  #- node_min_samples: 20
  #  node_max_samples: 40
  #  min_samples_train: 25
  - node_min_samples: 50
    node_max_samples: 110
    min_samples_train: 50
  #- node_min_samples: 100
  #  node_max_samples: 400
  #  min_samples_train: 140         

# Total number of nodes
num_nodes: 10

# Number of nodes to aggregate per round
quorum: 2

# ===========================================
# TRAINING SETTINGS
# ===========================================

# Total number of training rounds
num_rounds: 30
# Repeat each experiment configuration
num_runs: 10

# Base seed (run k uses seed + k): runs are reproducible and paired across algorithms
seed: 42
resplit_per_run: True   # repeated hold-out: per-node train/val/test split changes every run (partition of nodes stays fixed)

# Standardize the target with train stats (R² unchanged; MSE reported in original units)
scale_target: True

node_failure_rate: 0.0 # 0.0 not used
failure_interval: 1  # dropout occurs every round
robustness_runs: 1   # runs per condition when node_failure_rate > 0 (>= 10 for statistics)

# Leader crash (crash-recovery): with this probability per round the leader fails after
# collecting the updates and before consolidating them. The round is aborted for every
# algorithm, nodes keep their batches and re-send them; the leader is down for
# `leader_downtime` rounds. 0.0 = disabled.
leader_failure_rate: 0.0
leader_downtime: 2

nodes_heterogeneity: moderate # low, moderate, high, extreme, None

# Local updates per round of the gradient-based methods (converted to epochs from the batch size)
node_epochs: 500

# Toggle verbose logging
verbose: False

# Feature-selection threshold
max_features: 500

# Apply Feature Selection
feature_selection: False

# ===========================================
# STATISTICS (computed when num_runs >= 2)
# ===========================================
stats_reference: FedDelta       # compared against every other algorithm
stats_alpha: 0.05
equivalence_margin_r2: 0.01     # TOST margin vs Cent

# Grid search of the *_grid keys (eta0_grid, lambda_reg_grid, mu_grid, server_lr_grid, ...) on the validation set.
tune_hyperparameters: False
# Rounds of the short simulation used for tuning (default: num_rounds)
tuning_rounds: 15

# Save results (CSV, plots)
store_plots: True
orientation_plots: vertical  # "horizontal" | "vertical"

# ===========================================
# LEADER SELECTION
# ===========================================

# Gossip Leader
gossip_fanout: 3
gossip_rounds: 3

 # Number of consecutive rounds without improvement before considering the algorithm to have failed
max_skipped_rounds: 3

metrics:
 - mse 
 - r2
 - exec_time

train_ratio: 0.70
val_ratio: 0.15

global_split: False   # True only in exp_heterogeneity (split over all samples before partitioning)

# ===========================================
# ALGORITHM HYPERPARAMETERS
# ===========================================
algorithms:
  Cent:
    penalty: constant # 'constant': L2 penalty lambda_reg; None: no penalty
    lambda_reg: 0.01
    use: True
  
  FedDelta:
    penalty: constant
    timeout: 9000.0
    numeric_checks: False
    erank_diagnostics: False
    erank_diagnostics_max_history: None
    lambda_reg: 
    #  - 0.001
      - 0.01
    #  - 0.0001
    #  - 0.0001
    #  - 0.001
    use: True

  # ==================================================================
  # TABULAR-BASED ALGORITHMS
  # ==================================================================
  CentRF:
    n_estimators: 100
    n_estimators_grid: [50, 100, 200]       # tuned on the validation set
    max_depth: None
    max_depth_grid: [5, 10, 20, "None"]     # "None": grow the trees fully
    optimal: False
    cv_folds: 5
    use: True
  
  FedGD (FedAvg):
    eta0: 0.01
    eta0_grid: [0.0001, 0.0003, 0.001, 0.003, 0.01, 0.03, 0.1, 0.3]   # tuned on the validation set
    timeout: 9000.0
    lambda_reg: 0.01
    lambda_reg_grid: [0.001, 0.01, 0.1]
    aggregation_method: FedAvg
    penalty: constant
    early_stopping: True
    use: True

  FedGD (FedNova):
    eta0: 0.01
    eta0_grid: [0.0001, 0.0003, 0.001, 0.003, 0.01, 0.03, 0.1, 0.3]   # tuned on the validation set
    lambda_reg_grid: [0.001, 0.01, 0.1]
    timeout: 9000.0
    lambda_reg: 0.01
    aggregation_method: FedNova
    penalty: constant
    early_stopping: True
    use: True

  FedGD (FedProx):
    eta0: 0.01
    eta0_grid: [0.0001, 0.0003, 0.001, 0.003, 0.01, 0.03, 0.1, 0.3]   # tuned on the validation set
    lambda_reg_grid: [0.001, 0.01, 0.1]
    timeout: 9000.0
    lambda_reg: 0.01
    mu: 0.01
    mu_grid: [0.0001, 0.001, 0.01, 0.1]
    aggregation_method: FedProx
    penalty: constant
    early_stopping: True
    use: True

  FedSCAFFOLD:
    weighting: uniform
    eta0: 0.01
    eta0_grid: [0.0001, 0.0003, 0.001, 0.003, 0.01, 0.03, 0.1, 0.3]
    server_lr_grid: [0.1, 0.3, 1.0]
    lambda_reg_grid: [0.001, 0.01, 0.1]
    server_lr: 1.0
    lambda_reg: 0.01
    penalty: constant
    timeout: 9000.0
    use: True

  FedGD (FedAvgM):
    eta0: 0.01
    eta0_grid: [0.0001, 0.0003, 0.001, 0.003, 0.01, 0.03, 0.1, 0.3]
    lambda_reg_grid: [0.001, 0.01, 0.1]
    server_lr: 1.0
    server_lr_grid: [0.1, 0.3, 1.0]
    server_beta1: 0.9
    aggregation_method: FedAvgM
    timeout: 9000.0
    lambda_reg: 0.01
    penalty: constant
    early_stopping: True
    use: True

  # ==================================================================
  # NON-LINEAR BASELINES (neural network)
  # ==================================================================
  FedMLP (FedAvg):
    hidden_layers: [64, 32]
    activation: relu
    optimizer: adam
    local_epochs: 5      # real epochs (node_epochs counts GD updates)
    eta0: 0.001
    eta0_grid: [0.0003, 0.001, 0.003, 0.01, 0.03]
    lambda_reg: 0.01
    lambda_reg_grid: [0.001, 0.01, 0.1]
    aggregation_method: FedAvg
    timeout: 9000.0
    use: True

  CentMLP:
    hidden_layers: [64, 32]
    activation: relu
    eta0: 0.001
    eta0_grid: [0.0003, 0.001, 0.003, 0.01, 0.03]   # tuned on the validation set
    lambda_reg: 0.01
    lambda_reg_grid: [0.001, 0.01, 0.1]
    epochs: 5
    use: True
